name: StackFit Social Broadcast

on:
  schedule:
    # Runs daily at 07:30 UTC, 30 minutes after the daily radar data refresh
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Content topic to broadcast"
        required: true
        default: "spiker"
        type: choice
        options:
          - spiker
          - stack
      dry_run:
        description: "Dry run preview (do not send to live APIs)"
        required: true
        type: boolean
        default: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Broadcast to Configured Social Networks
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python engine/social_poster.py --topic ${{ github.event.inputs.topic || 'spiker' }} --dry-run
          else
            python engine/social_poster.py --topic ${{ github.event.inputs.topic || 'spiker' }} --post
          fi
