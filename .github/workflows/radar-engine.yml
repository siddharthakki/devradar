name: DevRadar Engine Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-sync
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r engine/requirements.txt

      - name: Ingest & Categorize Repos
        run: python engine/analyzer.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Feeds & Static API
        run: python engine/rss.py

      - name: Commit and push snapshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected this hour. Working tree clean."
          else
            git commit -m "chore(data): sync radar & distribution endpoints [skip ci]"
            git push origin main
          fi
