<!DOCTYPE html>
<html lang="en" data-theme="amber">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevRadar — Autonomous Open-Source Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            radarDark: 'var(--bg-radar)',
            cardDark: 'var(--bg-card)',
            borderDark: 'var(--border-color)',
            accentPrimary: 'var(--accent-primary)',
            accentSecondary: 'var(--accent-secondary)',
            textMain: 'var(--text-main)',
            textMuted: 'var(--text-muted)',
          }
        }
      }
    }
  </script>
  <style>
    :root[data-theme="amber"] {
      --bg-radar: #0c0a09; --bg-card: #1c1917; --border-color: #292524;
      --accent-primary: #f59e0b; --accent-secondary: #fbbf24;
      --text-main: #e7e5e4; --text-muted: #a8a29e;
    }
    :root[data-theme="emerald"] {
      --bg-radar: #021a14; --bg-card: #062b22; --border-color: #0f3e33;
      --accent-primary: #10b981; --accent-secondary: #34d399;
      --text-main: #d1fae5; --text-muted: #6ee7b7;
    }
    :root[data-theme="violet"] {
      --bg-radar: #090514; --bg-card: #130c25; --border-color: #261845;
      --accent-primary: #a855f7; --accent-secondary: #ec4899;
      --text-main: #f3e8ff; --text-muted: #c084fc;
    }
    :root[data-theme="copper"] {
      --bg-radar: #0e0706; --bg-card: #1c0f0d; --border-color: #2d1714;
      --accent-primary: #ea580c; --accent-secondary: #e11d48;
      --text-main: #fde8e5; --text-muted: #fb923c;
    }
    :root[data-theme="titanium"] {
      --bg-radar: #000000; --bg-card: #111111; --border-color: #262626;
      --accent-primary: #ffffff; --accent-secondary: #a3a3a3;
      --text-main: #f5f5f5; --text-muted: #737373;
    }
    :root[data-theme="cyan"] {
      --bg-radar: #080c14; --bg-card: #0f172a; --border-color: #1e293b;
      --accent-primary: #38bdf8; --accent-secondary: #22d3ee;
      --text-main: #f1f5f9; --text-muted: #94a3b8;
    }
    body {
      background-color: var(--bg-radar);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .skeleton-box {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--border-color) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: skeleton-pulse 1.5s infinite;
    }
    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
  
  <header class="sticky top-0 z-50 bg-radarDark/95 backdrop-blur-md border-b border-borderDark shadow-xl">
    <div class="w-full px-4 sm:px-6 lg:px-10 py-3">
      <div class="flex items-center justify-between gap-3">
        <div>
          <div class="flex items-center gap-3">
            <h1 class="text-xl font-black tracking-tight text-textMain">DEV<span class="text-accentPrimary">RADAR</span></h1>
            <a href="how-it-works.html" class="text-xs font-mono text-textMuted hover:text-accentSecondary underline underline-offset-4 transition">Methodology ↗</a> <a href="data/feed.xml" target="_blank" title="RSS 2.0 Feed" class="text-xs font-mono text-textMuted hover:text-accentSecondary transition ml-2">📡 RSS</a>
          </div>
          <p class="text-xs text-textMuted hidden sm:block">Autonomous discovery engine ranking breakout open source by 24h velocity & authenticity.</p>
        </div>

        <div class="flex items-center gap-2 sm:gap-3 text-xs font-mono text-textMuted">
          <!-- Theme Picker -->
          <div class="flex items-center gap-1 bg-cardDark border border-borderDark px-2 py-1.5 rounded-lg">
            <label for="themeSelect" class="sr-only">Color Theme</label>
            <span>🎨</span>
            <select id="themeSelect" class="bg-transparent text-textMain text-xs font-mono focus:outline-none cursor-pointer">
              <option value="amber" class="bg-cardDark">Amber</option>
              <option value="emerald" class="bg-cardDark">Emerald</option>
              <option value="violet" class="bg-cardDark">Violet</option>
              <option value="copper" class="bg-cardDark">Copper</option>
              <option value="titanium" class="bg-cardDark">Titanium</option>
              <option value="cyan" class="bg-cardDark">Cyan</option>
            </select>
          </div>

          <!-- My Radar Bookmark View Toggle -->
          <button id="toggleBookmarksBtn" aria-label="View Saved Bookmarks" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-borderDark bg-cardDark text-textMain hover:border-accentPrimary transition">
            <span>🔖</span>
            <span class="hidden sm:inline">My Radar</span>
            <span id="bookmarkCount" class="text-[10px] bg-radarDark px-1.5 py-0.2 rounded border border-borderDark">0</span>
          </button>

          <!-- Mobile Filter Accordion Button -->
          <button id="mobileFilterToggle" aria-label="Toggle Filter Controls" class="md:hidden p-2 rounded-lg border border-borderDark bg-cardDark text-textMain">
            ⚡ Filters
          </button>
        </div>
      </div>

      <!-- Controls Drawer (Collapsible on Mobile) -->
      <div id="filterDrawer" class="hidden md:flex flex-col gap-2.5 pt-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-12 gap-2">
          <div class="relative md:col-span-5">
            <input id="searchBox" type="search" placeholder="Search name, language, keywords..." aria-label="Search repositories" class="w-full bg-cardDark border border-borderDark text-xs rounded-lg pl-3 pr-24 py-2 text-textMain placeholder:text-textMuted/60 focus:outline-none focus:ring-1 focus:ring-accentPrimary" />
            <span id="matchCounter" class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] font-mono text-accentPrimary bg-radarDark px-2 py-0.5 rounded border border-borderDark font-semibold">0 repos</span>
          </div>

          <select id="categoryFilter" aria-label="Filter by Discipline" class="bg-cardDark border border-borderDark text-xs rounded-lg px-2.5 py-2 text-textMain md:col-span-3 focus:outline-none focus:ring-1 focus:ring-accentPrimary">
            <option value="all">Matrix View (All 20 Disciplines)</option>
          </select>

          <select id="licenseFilter" aria-label="Filter by License" class="bg-cardDark border border-borderDark text-xs rounded-lg px-2.5 py-2 text-textMain md:col-span-2 focus:outline-none focus:ring-1 focus:ring-accentPrimary">
            <option value="all">All Licenses</option>
          </select>

          <select id="sortSelect" aria-label="Sort Repositories" class="bg-cardDark border border-borderDark text-xs rounded-lg px-2.5 py-2 text-textMain md:col-span-2 focus:outline-none focus:ring-1 focus:ring-accentPrimary">
            <option value="breakout">Breakout Score 🔥</option>
            <option value="delta">24h Velocity 🚀</option>
            <option value="stars">Total Stars ⭐</option>
            <option value="recency">Pushed Recently 🕒</option>
          </select>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs text-textMuted mr-1 font-mono">Specs:</span>
          <button id="toggleLocalFirst" class="px-2.5 py-1 text-xs rounded-full border border-borderDark bg-cardDark text-textMuted hover:text-textMain transition">🔒 Local-First</button>
          <button id="toggleCuda" class="px-2.5 py-1 text-xs rounded-full border border-borderDark bg-cardDark text-textMuted hover:text-textMain transition">⚡ GPU / CUDA</button>
          <button id="toggleOrganic" class="px-2.5 py-1 text-xs rounded-full border border-borderDark bg-cardDark text-textMuted hover:text-textMain transition">🛡️ High Authenticity</button>
        </div>
      </div>
    </div>
  </header>

  <main class="w-full px-4 sm:px-6 lg:px-10 py-6">
    <div id="filterStatusBanner" class="hidden mb-6 p-3 bg-cardDark border border-borderDark rounded-xl flex items-center justify-between text-xs font-mono">
      <div class="flex items-center gap-2">
        <span class="text-accentPrimary font-bold" id="bannerTitle">Viewing</span>
        <span class="text-textMuted" id="bannerCount"></span>
      </div>
      <button onclick="window.selectCategory('all')" class="text-xs text-accentSecondary underline">
        &larr; Back to Matrix View
      </button>
    </div>

    <!-- Repository Target Container -->
    <div id="repoContainer">
      <!-- High-Fidelity Loading Skeletons -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
        <div class="h-64 rounded-xl border border-borderDark skeleton-box"></div>
        <div class="h-64 rounded-xl border border-borderDark skeleton-box"></div>
        <div class="h-64 rounded-xl border border-borderDark skeleton-box"></div>
        <div class="h-64 rounded-xl border border-borderDark skeleton-box"></div>
        <div class="h-64 rounded-xl border border-borderDark skeleton-box"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { TAXONOMY, classifyRepo, computeBreakoutScore, getSimilarRepos } from './devradar-core.js';

    let repositories = [];
    let bookmarks = JSON.parse(localStorage.getItem('devradar-bookmarks') || '[]');
    let showBookmarksOnly = false;
    let filterLocalFirst = false;
    let filterCuda = false;
    let filterOrganic = false;

    // Theme Switcher Init
    const themeSelect = document.getElementById('themeSelect');
    const savedTheme = localStorage.getItem('devradar-theme') || 'amber';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeSelect.value = savedTheme;
    themeSelect.addEventListener('change', (e) => {
      document.documentElement.setAttribute('data-theme', e.target.value);
      localStorage.setItem('devradar-theme', e.target.value);
    });

    // Mobile drawer toggle
    document.getElementById('mobileFilterToggle').addEventListener('click', () => {
      document.getElementById('filterDrawer').classList.toggle('hidden');
    });

    window.toggleBookmark = function(repoName) {
      const idx = bookmarks.indexOf(repoName);
      if (idx > -1) bookmarks.splice(idx, 1);
      else bookmarks.push(repoName);
      localStorage.setItem('devradar-bookmarks', JSON.stringify(bookmarks));
      updateBookmarkCounter();
      render();
    };

    function updateBookmarkCounter() {
      document.getElementById('bookmarkCount').textContent = bookmarks.length;
    }

    document.getElementById('toggleBookmarksBtn').addEventListener('click', () => {
      showBookmarksOnly = !showBookmarksOnly;
      document.getElementById('toggleBookmarksBtn').classList.toggle('border-accentPrimary', showBookmarksOnly);
      render();
    });

    window.selectCategory = function(cat) {
      const select = document.getElementById('categoryFilter');
      if (select) {
        select.value = cat;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    window.copyToClipboard = function(text, btnId) {
      navigator.clipboard.writeText(text);
      const el = document.getElementById(btnId);
      if (el) {
        const orig = el.textContent;
        el.textContent = 'COPIED!';
        el.style.color = 'var(--accent-secondary)';
        setTimeout(() => {
          el.textContent = orig;
          el.style.color = '';
        }, 1500);
      }
    };

    function getCommandIcon(cmd) {
      if (!cmd) return '💻';
      const c = cmd.toLowerCase().trim();
      if (c.startsWith('npm') || c.startsWith('npx')) return '📦';
      if (c.startsWith('pip') || c.startsWith('python')) return '🐍';
      if (c.startsWith('docker')) return '🐳';
      if (c.startsWith('cargo')) return '🦀';
      return '💻';
    }

    function generateSparkline(history) {
      if (!history || history.length < 2) return '';
      const stars = history.map(h => h.stars);
      const min = Math.min(...stars);
      const max = Math.max(...stars);
      const range = max - min || 1;
      const width = 64;
      const height = 18;

      const points = stars.map((val, idx) => {
        const x = (idx / (stars.length - 1)) * width;
        const y = height - ((val - min) / range) * (height - 4) - 2;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      return `
        <svg class="w-16 h-4 overflow-visible inline-block opacity-85 hover:opacity-100 transition" viewBox="0 0 ${width} ${height}" aria-hidden="true">
          <polyline fill="none" stroke="var(--accent-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${points}" />
        </svg>
      `;
    }

    async function loadDataset() {
      try {
        const res = await fetch(`data/repos.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const rawItems = Array.isArray(data) ? data : (data.repositories || []);

        repositories = rawItems.map(r => {
          const category = r.category && TAXONOMY[r.category] ? r.category : classifyRepo(r);
          const breakoutScore = computeBreakoutScore({ ...r, category });
          return { ...r, category, breakout_score: breakoutScore };
        });

        populateFilters();
        updateBookmarkCounter();
        render();
      } catch (err) {
        console.warn('Sync load notice:', err);
      }
    }

    function populateFilters() {
      const catSelect = document.getElementById('categoryFilter');
      catSelect.innerHTML = '<option value="all">Matrix View (All 20 Disciplines)</option>';
      Object.keys(TAXONOMY).forEach(cat => {
        catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
      });

      const licSelect = document.getElementById('licenseFilter');
      const licenses = Array.from(new Set(repositories.map(r => r.license).filter(Boolean))).sort();
      licSelect.innerHTML = '<option value="all">All Licenses</option>';
      licenses.forEach(lic => {
        licSelect.innerHTML += `<option value="${lic}">${lic}</option>`;
      });
    }

    function renderCard(r, idx) {
      const daysAgo = Math.max(1, Math.round((Date.now() - new Date(r.created_at || Date.now()).getTime()) / (1000 * 3600 * 24)));
      const isBookmarked = bookmarks.includes(r.full_name || r.name);
      const copyBtnId = `btn-copy-${idx}-${Math.floor(Math.random()*1000)}`;
      const cmdIcon = getCommandIcon(r.quick_run);
      const desc = r.description?.trim() || '<span class="italic text-textMuted/60">[No description provided]</span>';

      const similar = getSimilarRepos(r, repositories, 2);
      let similarPills = '';
      if (similar.length > 0) {
        similarPills = `
          <div class="mt-3 pt-2 border-t border-borderDark flex items-center gap-1.5 text-[10px] font-mono text-textMuted overflow-hidden">
            <span class="text-textMuted/60 shrink-0">Related:</span>
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              ${similar.map(s => `
                <a href="${s.url}" target="_blank" rel="noopener noreferrer" 
                   title="${s.description || s.name}"
                   class="px-1.5 py-0.5 rounded bg-radarDark border border-borderDark hover:border-accentPrimary text-accentSecondary transition shrink-0 truncate max-w-[120px]">
                  ${s.name}
                </a>
              `).join('')}
            </div>
          </div>
        `;
      }

      const mediaHtml = r.image_url 
        ? `<div class="w-full h-32 bg-radarDark border-b border-borderDark overflow-hidden relative">
             <img src="${r.image_url}" alt="Repository preview" class="w-full h-full object-cover object-top opacity-90 hover:opacity-100 transition" loading="lazy" onerror="this.parentElement.style.display='none';" />
           </div>`
        : '';

      return `
        <article class="bg-cardDark border border-borderDark hover:border-accentPrimary/50 transition duration-200 rounded-xl overflow-hidden flex flex-col justify-between shadow-lg">
          ${mediaHtml}
          <div class="p-4 flex flex-col flex-1">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-radarDark text-accentSecondary border border-borderDark truncate max-w-[170px]">
                ${r.category}
              </span>
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] font-mono text-textMuted border border-borderDark px-1.5 py-0.5 rounded bg-radarDark">${r.license || 'MIT'}</span>
                <button onclick="window.toggleBookmark('${r.full_name || r.name}')" aria-label="Bookmark ${r.name}" class="text-sm hover:scale-125 transition">
                  ${isBookmarked ? '🔖' : '📑'}
                </button>
              </div>
            </div>

            <div class="mt-2.5 flex items-baseline justify-between gap-2">
              <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="text-sm font-bold text-textMain hover:text-accentPrimary transition truncate">
                ${r.full_name || r.name}
              </a>
              <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-radarDark text-accentPrimary border border-borderDark" title="Calculated from fork ratio and velocity distribution">
                ${r.authenticity_score || 95}% Organic
              </span>
            </div>

            <p class="mt-1.5 text-xs text-textMuted leading-relaxed line-clamp-2">${desc}</p>

            <div class="mt-3 p-1.5 bg-radarDark rounded-lg border border-borderDark flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5 overflow-hidden">
                <span class="text-xs select-none" aria-hidden="true">${cmdIcon}</span>
                <code class="text-[10px] text-textMain font-mono truncate select-all">${r.quick_run || 'git clone ' + (r.url || '')}</code>
              </div>
              <button id="${copyBtnId}" onclick="copyToClipboard('${(r.quick_run || 'git clone ' + (r.url || '')).replace(/'/g, "\\'")}', '${copyBtnId}')" 
                      aria-label="Copy clone command"
                      class="text-[9px] font-mono uppercase text-textMuted hover:text-textMain px-2 py-0.5 rounded bg-cardDark border border-borderDark transition">
                COPY
              </button>
            </div>

            ${similarPills}
          </div>

          <div class="px-4 py-2.5 border-t border-borderDark bg-radarDark/60 flex items-center justify-between text-xs font-mono">
            <div class="flex items-center gap-2 text-textMuted text-[11px]">
              <span class="text-textMain">${r.language || 'Code'}</span>
              <span>•</span>
              <span>${r.hardware_req || 'Minimal'}</span>
            </div>
            <div class="flex items-center gap-2">
              ${generateSparkline(r.star_history)}
              ${(r.stars_24h || r.v24) > 0 ? `<span class="text-accentSecondary font-bold text-[11px]">+${r.stars_24h || r.v24} 24h</span>` : ''}
              <span class="text-accentPrimary font-semibold text-[11px]">⭐ ${(r.stars || 0).toLocaleString()}</span>
            </div>
          </div>
        </article>
      `;
    }

    function render() {
      const search = document.getElementById('searchBox').value.toLowerCase().trim();
      const selectedCat = document.getElementById('categoryFilter').value;
      const selectedLic = document.getElementById('licenseFilter').value;
      const sortType = document.getElementById('sortSelect').value;

      const anySpecActive = filterLocalFirst || filterCuda || filterOrganic;

      let filtered = repositories.filter(repo => {
        if (showBookmarksOnly && !bookmarks.includes(repo.full_name || repo.name)) return false;

        const matchesSearch = !search || 
          (repo.name || '').toLowerCase().includes(search) || 
          (repo.full_name || '').toLowerCase().includes(search) ||
          (repo.description || '').toLowerCase().includes(search) ||
          (repo.language || '').toLowerCase().includes(search) ||
          (repo.topics || []).some(t => t.toLowerCase().includes(search));

        const matchesLic = (selectedLic === 'all') || (repo.license === selectedLic);

        let matchesSpecs = true;
        if (anySpecActive) {
          matchesSpecs = (filterLocalFirst && repo.is_local_first) ||
                         (filterCuda && repo.is_cuda_ready) ||
                         (filterOrganic && (repo.authenticity_score || 95) >= 85);
        }

        return matchesSearch && matchesLic && matchesSpecs;
      });

      document.getElementById('matchCounter').textContent = `${filtered.length} repos`;

      if (sortType === 'delta') filtered.sort((a, b) => (b.stars_24h || b.v24 || 0) - (a.stars_24h || a.v24 || 0));
      else if (sortType === 'stars') filtered.sort((a, b) => (b.stars || 0) - (a.stars || 0));
      else if (sortType === 'recency') filtered.sort((a, b) => new Date(b.pushed_at || b.created_at || 0) - new Date(a.pushed_at || a.created_at || 0));
      else filtered.sort((a, b) => (b.breakout_score || 0) - (a.breakout_score || 0));

      const container = document.getElementById('repoContainer');
      const banner = document.getElementById('filterStatusBanner');

      if (showBookmarksOnly) {
        banner.classList.remove('hidden');
        document.getElementById('bannerTitle').textContent = "My Bookmarked Radar";
        document.getElementById('bannerCount').textContent = `(${filtered.length} repositories saved)`;
        if (!filtered.length) {
          container.innerHTML = `<div class="py-16 text-center text-textMuted font-mono text-sm">No bookmarked repositories yet. Click 📑 on any card to save it.</div>`;
          return;
        }
        container.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
            ${filtered.map((r, i) => renderCard(r, i)).join('')}
          </div>
        `;
        return;
      }

      if (selectedCat !== 'all') {
        const catItems = filtered.filter(r => r.category === selectedCat);
        banner.classList.remove('hidden');
        document.getElementById('bannerTitle').textContent = selectedCat;
        document.getElementById('bannerCount').textContent = `(${catItems.length} repos)`;

        if (!catItems.length) {
          container.innerHTML = `<div class="py-16 text-center text-textMuted font-mono text-sm">No repositories found in "${selectedCat}".</div>`;
          return;
        }
        container.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
            ${catItems.map((r, i) => renderCard(r, i)).join('')}
          </div>
        `;
        return;
      }

      banner.classList.add('hidden');

      const activeCategories = Object.keys(TAXONOMY).filter(cat => filtered.some(r => r.category === cat));
      if (!activeCategories.length) {
        container.innerHTML = `<div class="py-16 text-center text-textMuted font-mono text-sm">No repositories matching selected constraints.</div>`;
        return;
      }

      container.innerHTML = activeCategories.map(cat => {
        const catAll = filtered.filter(r => r.category === cat);
        const catSlice = catAll.slice(0, 5);

        return `
          <section class="mb-10">
            <div class="flex items-center justify-between pb-2 mb-4 border-b border-borderDark/80">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-accentPrimary"></span>
                <h2 class="text-sm font-bold tracking-tight text-textMain">${cat}</h2>
                <span class="text-[11px] font-mono text-textMuted">(${catAll.length})</span>
              </div>
              <button onclick="window.selectCategory('${cat}')" class="text-xs font-mono text-accentPrimary hover:text-accentSecondary transition flex items-center gap-1">
                View all ${catAll.length} &rarr;
              </button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
              ${catSlice.map((r, i) => renderCard(r, `${cat}-${i}`)).join('')}
            </div>
          </section>
        `;
      }).join('');
    }

    function setupToggle(btnId, getState, setState) {
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        const next = !getState();
        setState(next);
        btn.classList.toggle('border-accentPrimary', next);
        btn.classList.toggle('text-accentPrimary', next);
        render();
      });
    }

    setupToggle('toggleLocalFirst', () => filterLocalFirst, v => filterLocalFirst = v);
    setupToggle('toggleCuda', () => filterCuda, v => filterCuda = v);
    setupToggle('toggleOrganic', () => filterOrganic, v => filterOrganic = v);

    document.getElementById('searchBox').addEventListener('input', render);
    document.getElementById('categoryFilter').addEventListener('change', render);
    document.getElementById('licenseFilter').addEventListener('change', render);
    document.getElementById('sortSelect').addEventListener('change', render);

    loadDataset();
    setInterval(loadDataset, 60000);
  </script>
</body>
</html>
