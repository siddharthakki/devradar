<!DOCTYPE html>
<html lang="en" data-theme="amber">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevRadar — Autonomous Open-Source Matchmaker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            radarDark: 'var(--bg-radar)',
            cardDark: 'var(--bg-card)',
            borderDark: 'var(--border-color)',
            accentPrimary: 'var(--accent-primary)',
            accentSecondary: 'var(--accent-secondary)',
            textMain: 'var(--text-main)',
            textMuted: 'var(--text-muted)',
          }
        }
      }
    }
  </script>
  <style>
    :root[data-theme="amber"] {
      --bg-radar: #0c0a09; --bg-card: #1c1917; --border-color: #292524;
      --accent-primary: #f59e0b; --accent-secondary: #fbbf24;
      --text-main: #e7e5e4; --text-muted: #a8a29e;
    }
    :root[data-theme="emerald"] {
      --bg-radar: #021a14; --bg-card: #062b22; --border-color: #0f3e33;
      --accent-primary: #10b981; --accent-secondary: #34d399;
      --text-main: #d1fae5; --text-muted: #6ee7b7;
    }
    :root[data-theme="violet"] {
      --bg-radar: #090514; --bg-card: #130c25; --border-color: #261845;
      --accent-primary: #a855f7; --accent-secondary: #ec4899;
      --text-main: #f3e8ff; --text-muted: #c084fc;
    }
    :root[data-theme="copper"] {
      --bg-radar: #0e0706; --bg-card: #1c0f0d; --border-color: #2d1714;
      --accent-primary: #ea580c; --accent-secondary: #e11d48;
      --text-main: #fde8e5; --text-muted: #fb923c;
    }
    :root[data-theme="titanium"] {
      --bg-radar: #000000; --bg-card: #111111; --border-color: #262626;
      --accent-primary: #ffffff; --accent-secondary: #a3a3a3;
      --text-main: #f5f5f5; --text-muted: #737373;
    }
    :root[data-theme="cyan"] {
      --bg-radar: #080c14; --bg-card: #0f172a; --border-color: #1e293b;
      --accent-primary: #38bdf8; --accent-secondary: #22d3ee;
      --text-main: #f1f5f9; --text-muted: #94a3b8;
    }
    body { background-color: var(--bg-radar); color: var(--text-main); transition: background-color 0.2s; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-radar); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen font-sans antialiased pb-24">
  
  <header class="sticky top-0 z-50 bg-radarDark/95 backdrop-blur-md border-b border-borderDark shadow-xl">
    <div class="w-full px-4 sm:px-6 lg:px-10 py-3">
      <div class="flex items-center justify-between gap-3">
        <div>
          <div class="flex items-center gap-3">
            <h1 class="text-xl font-black tracking-tight text-textMain">DEV<span class="text-accentPrimary">RADAR</span></h1>
            <span class="text-[10px] font-mono uppercase px-2 py-0.5 rounded border border-borderDark text-accentSecondary bg-cardDark">Matchmaker</span>
            <a href="how-it-works.html" class="text-xs font-mono text-textMuted hover:text-accentSecondary underline ml-2 transition">Methodology ↗</a>
            <a href="data/feed.xml" target="_blank" class="text-xs font-mono text-textMuted hover:text-accentSecondary ml-2">📡 RSS</a>
          </div>
          <p class="text-xs text-textMuted hidden sm:block">Query by architectural intent, hardware viability & real health metrics.</p>
        </div>

        <div class="flex items-center gap-2 sm:gap-3 text-xs font-mono text-textMuted">
          <button id="toggleBookmarksBtn" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-borderDark bg-cardDark text-textMain hover:border-accentPrimary transition">
            <span>🔖</span> <span id="bookmarkCount" class="text-[10px] bg-radarDark px-1.5 py-0.5 rounded border border-borderDark">0</span>
          </button>

          <div class="flex items-center gap-1 bg-cardDark border border-borderDark px-2 py-1.5 rounded-lg">
            <span>🎨</span>
            <select id="themeSelect" class="bg-transparent text-textMain text-xs font-mono focus:outline-none cursor-pointer">
              <option value="amber" class="bg-cardDark">Amber</option>
              <option value="emerald" class="bg-cardDark">Emerald</option>
              <option value="violet" class="bg-cardDark">Violet</option>
              <option value="copper" class="bg-cardDark">Copper</option>
              <option value="titanium" class="bg-cardDark">Titanium</option>
              <option value="cyan" class="bg-cardDark">Cyan</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 1. COMPOSITE CHIP BUILDER & SEARCH BOX -->
      <div class="mt-3 relative">
        <div id="searchContainer" class="w-full bg-cardDark border border-borderDark focus-within:border-accentPrimary rounded-xl p-1.5 flex flex-wrap items-center gap-1.5 transition">
          <span class="text-textMuted pl-2 select-none text-xs">🔍</span>
          
          <!-- Active Token Chips Render Here -->
          <div id="activeChips" class="flex flex-wrap items-center gap-1.5"></div>

          <!-- Free-text input with Ghost Text Placeholders -->
          <input 
            id="searchBox" 
            type="text" 
            autocomplete="off"
            placeholder="Search or click builder chips below..." 
            class="flex-1 min-w-[220px] bg-transparent text-xs text-textMain placeholder:text-textMuted/50 focus:outline-none px-2 py-1"
          />

          <span id="matchCounter" class="text-[10px] font-mono text-accentPrimary bg-radarDark px-2 py-0.5 rounded border border-borderDark font-semibold ml-auto mr-1">
            0 repos
          </span>
        </div>

        <!-- 3. SYNTAX AUTOCOMPLETE POPUP (: trigger) -->
        <div id="autocompletePopup" class="absolute top-full left-0 mt-1 w-72 bg-cardDark border border-borderDark rounded-xl shadow-2xl z-50 hidden py-1 text-xs font-mono">
          <div class="px-3 py-1.5 text-[10px] text-textMuted border-b border-borderDark uppercase tracking-wider font-semibold" id="autocompleteTitle">
            Filter Values
          </div>
          <div id="autocompleteOptions" class="max-h-48 overflow-y-auto"></div>
        </div>
      </div>

      <!-- 4. NATURAL LANGUAGE TRANSLATE BADGE -->
      <div id="nlTranslateBanner" class="hidden mt-2 p-2 bg-cardDark/80 border border-borderDark rounded-lg flex items-center justify-between text-xs font-mono">
        <div class="flex items-center gap-2">
          <span class="text-accentSecondary">✨ Intent Translated:</span>
          <code id="translatedPill" class="text-[11px] text-accentPrimary bg-radarDark px-2 py-0.5 rounded border border-borderDark"></code>
        </div>
        <button onclick="window.clearNlTranslation()" class="text-textMuted hover:text-textMain text-[11px]">&times; Reset</button>
      </div>

      <!-- 1. INLINE CHIP BUILDER RIBBONS -->
      <div class="mt-2.5 flex flex-col gap-1.5 text-[11px] font-mono">
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
          <span class="text-textMuted/60 shrink-0 select-none">Discipline:</span>
          <button onclick="window.addChip('discipline', 'Local LLM Engines')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">Local LLM</button>
          <button onclick="window.addChip('discipline', 'Multi-Agent Frameworks')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">Multi-Agent</button>
          <button onclick="window.addChip('discipline', 'RAG Engines')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">RAG</button>
          <button onclick="window.addChip('discipline', 'CLI & TUI Tooling')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">CLI Tools</button>
          <button onclick="window.addChip('discipline', 'Generative Image/Video')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">Media/Gen</button>
        </div>

        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
          <span class="text-textMuted/60 shrink-0 select-none">Language:</span>
          <button onclick="window.addChip('lang', 'Python')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">Python</button>
          <button onclick="window.addChip('lang', 'Rust')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">Rust</button>
          <button onclick="window.addChip('lang', 'TypeScript')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">TypeScript</button>
          <button onclick="window.addChip('lang', 'Go')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">Go</button>
          <span class="text-textMuted/40 mx-1">|</span>
          <span class="text-textMuted/60 shrink-0 select-none">Needs:</span>
          <button onclick="window.addChip('needs', 'cpu-only')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">💻 CPU only</button>
          <button onclick="window.addChip('needs', 'gpu')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">⚡ GPU CUDA</button>
          <button onclick="window.addChip('needs', 'local-first')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">🔒 Local-first</button>
          <button onclick="window.addChip('needs', 'mcp')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">🔌 MCP</button>
          <span class="text-textMuted/40 mx-1">|</span>
          <span class="text-textMuted/60 shrink-0 select-none">License:</span>
          <button onclick="window.addChip('lic', 'MIT')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">MIT</button>
          <button onclick="window.addChip('lic', 'Apache-2.0')" class="chip-btn px-2 py-0.5 rounded bg-cardDark border border-borderDark text-textMuted hover:border-accentPrimary hover:text-textMain transition shrink-0">Apache-2.0</button>
        </div>
      </div>
    </div>
  </header>

  <main class="w-full px-4 sm:px-6 lg:px-10 py-6">
    <div id="repoContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
      <div class="py-20 text-center text-textMuted font-mono text-sm col-span-full">Connecting to intent engine...</div>
    </div>
  </main>

  <script type="module">
    import { TAXONOMY, classifyRepo, computeBreakoutScore, getSimilarRepos, parseNaturalLanguage } from './devradar-core.js';

    let repositories = [];
    let bookmarks = JSON.parse(localStorage.getItem('devradar-bookmarks') || '[]');
    let showBookmarksOnly = false;
    let activeChips = []; // Array of { key: 'lang'|'discipline'|'needs'|'lic'|'stage', val: string }
    let nlFilters = {}; // Active natural language parsed constraints

    // 2. ROTATING GHOST TEXT EXAMPLES
    const ghostExamples = [
      "lang:python needs:gpu stars:>1000",
      "local-first llm engine for macos",
      "rag framework lang:typescript lic:apache-2.0",
      "agent framework needs:mcp",
      "fast audio whisper without gpu",
      "discipline:\"CLI & TUI Tooling\" lang:rust"
    ];
    let ghostIndex = 0;
    const searchInput = document.getElementById('searchBox');

    setInterval(() => {
      if (document.activeElement !== searchInput && !searchInput.value) {
        ghostIndex = (ghostIndex + 1) % ghostExamples.length;
        searchInput.placeholder = ghostExamples[ghostIndex];
      }
    }, 3500);

    // 3. SYNTAX AUTOCOMPLETE DICTIONARY
    const schemaMap = {
      "lang:": ["python", "rust", "typescript", "javascript", "go", "c++"],
      "discipline:": ["\"Local LLM Engines\"", "\"Multi-Agent Frameworks\"", "\"RAG Engines\"", "\"CLI & TUI Tooling\"", "\"Vision & OCR\""],
      "needs:": ["cpu-only", "gpu", "local-first", "mcp", "real-time"],
      "lic:": ["mit", "apache-2.0", "gpl-3.0", "bsd-3-clause"],
      "stage:": ["mature", "active", "experimental", "maintenance"]
    };

    const autocompletePopup = document.getElementById('autocompletePopup');
    const autocompleteOptions = document.getElementById('autocompleteOptions');
    const autocompleteTitle = document.getElementById('autocompleteTitle');

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value;
      
      // Check for syntax trigger (ends with key:)
      const match = val.match(/(lang:|discipline:|needs:|lic:|stage:)$/i);
      if (match) {
        const trigger = match[1].toLowerCase();
        showAutocomplete(trigger);
      } else {
        autocompletePopup.classList.add('hidden');
      }

      // Check for natural language triggers
      parseNaturalLanguage(val);
      render();
    });

    function showAutocomplete(trigger) {
      const options = schemaMap[trigger] || [];
      autocompleteTitle.textContent = `Values for ${trigger}`;
      autocompleteOptions.innerHTML = options.map(opt => `
        <div onclick="window.selectAutocomplete('${trigger}', '${opt.replace(/"/g, '&quot;')}')" 
             class="px-3 py-1.5 hover:bg-radarDark hover:text-accentPrimary cursor-pointer transition flex items-center justify-between">
          <span>${opt}</span>
          <span class="text-[10px] text-textMuted/60">↵ select</span>
        </div>
      `).join('');
      autocompletePopup.classList.remove('hidden');
    }

    window.selectAutocomplete = function(trigger, opt) {
      const key = trigger.replace(':', '');
      window.addChip(key, opt.replace(/"/g, ''));
      // Remove trigger text from input
      searchInput.value = searchInput.value.replace(new RegExp(trigger + '$', 'i'), '').trim();
      autocompletePopup.classList.add('hidden');
      searchInput.focus();
      render();
    };

    // Close autocomplete on external click
    document.addEventListener('click', (e) => {
      if (!document.getElementById('searchContainer').contains(e.target) && !autocompletePopup.contains(e.target)) {
        autocompletePopup.classList.add('hidden');
      }
    });

    // 1. INLINE CHIP BUILDER LOGIC
    window.addChip = function(key, val) {
      // Prevent duplicate identical chips
      if (!activeChips.some(c => c.key === key && c.val.toLowerCase() === val.toLowerCase())) {
        activeChips.push({ key, val });
        renderChips();
        render();
      }
    };

    window.removeChip = function(index) {
      activeChips.splice(index, 1);
      renderChips();
      render();
    };

    function renderChips() {
      const container = document.getElementById('activeChips');
      container.innerHTML = activeChips.map((chip, idx) => `
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-radarDark border border-borderDark text-accentSecondary text-xs font-mono">
          <span class="text-textMuted/70 text-[10px]">${chip.key}:</span>
          <span>${chip.val}</span>
          <button onclick="window.removeChip(${idx})" class="text-textMuted hover:text-accentPrimary text-[11px] ml-0.5">&times;</button>
        </span>
      `).join('');
    }

    // 4. NATURAL LANGUAGE TRANSLATOR
    function parseNaturalLanguage(raw) {
      const q = raw.toLowerCase();
      nlFilters = {};

      if (q.includes("without gpu") || q.includes("no gpu") || q.includes("on cpu") || q.includes("for mac")) {
        nlFilters.needs = "cpu-only";
      } else if (q.includes("with gpu") || q.includes("needs cuda") || q.includes("rtx")) {
        nlFilters.needs = "gpu";
      }

      if (q.includes("in python") || q.includes("for python")) {
        nlFilters.lang = "python";
      } else if (q.includes("in rust")) {
        nlFilters.lang = "rust";
      } else if (q.includes("in typescript") || q.includes("in ts")) {
        nlFilters.lang = "typescript";
      }

      const banner = document.getElementById('nlTranslateBanner');
      const pill = document.getElementById('translatedPill');

      if (Object.keys(nlFilters).length > 0) {
        banner.classList.remove('hidden');
        pill.textContent = Object.entries(nlFilters).map(([k, v]) => `${k}:${v}`).join(' ');
      } else {
        banner.classList.add('hidden');
      }
    }

    window.clearNlTranslation = function() {
      nlFilters = {};
      document.getElementById('nlTranslateBanner').classList.add('hidden');
      render();
    };

    // THEME SELECTION
    const themeSelect = document.getElementById('themeSelect');
    const savedTheme = localStorage.getItem('devradar-theme') || 'amber';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeSelect.value = savedTheme;
    themeSelect.addEventListener('change', (e) => {
      document.documentElement.setAttribute('data-theme', e.target.value);
      localStorage.setItem('devradar-theme', e.target.value);
    });

    // BOOKMARKS
    window.toggleBookmark = function(repoName) {
      const idx = bookmarks.indexOf(repoName);
      if (idx > -1) bookmarks.splice(idx, 1);
      else bookmarks.push(repoName);
      localStorage.setItem('devradar-bookmarks', JSON.stringify(bookmarks));
      document.getElementById('bookmarkCount').textContent = bookmarks.length;
      render();
    };

    document.getElementById('toggleBookmarksBtn').addEventListener('click', () => {
      showBookmarksOnly = !showBookmarksOnly;
      document.getElementById('toggleBookmarksBtn').classList.toggle('border-accentPrimary', showBookmarksOnly);
      render();
    });

    async function loadDataset() {
      try {
        const res = await fetch(`data/repos.json?t=${Date.now()}`);
        const data = await res.json();
        const rawItems = Array.isArray(data) ? data : (data.repositories || []);

        repositories = rawItems.map(r => {
          const category = r.category && TAXONOMY[r.category] ? r.category : classifyRepo(r);
          const breakoutScore = computeBreakoutScore({ ...r, category });
          return { ...r, category, breakout_score: breakoutScore };
        });

        document.getElementById('bookmarkCount').textContent = bookmarks.length;
        render();
      } catch (err) {
        console.warn('Pipeline fetch warning:', err);
      }
    }

    function renderCard(r, idx) {
      const daysAgo = Math.max(1, Math.round((Date.now() - new Date(r.created_at || Date.now()).getTime()) / (1000 * 3600 * 24)));
      const isBookmarked = bookmarks.includes(r.full_name || r.name);
      const stage = r.health?.stage || 'active';
      const stagePill = stage === 'mature' 
        ? '<span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Mature</span>'
        : (stage === 'experimental' ? '<span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-purple-500/10 text-purple-400 border border-purple-500/20">Experimental</span>' : '');

      return `
        <div class="bg-cardDark border border-borderDark hover:border-accentPrimary/50 transition rounded-xl p-4 flex flex-col justify-between shadow-lg">
          <div>
            <div class="flex items-center justify-between gap-1">
              <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-radarDark text-accentSecondary border border-borderDark truncate max-w-[150px]">${r.category}</span>
              <div class="flex items-center gap-1.5">
                ${stagePill}
                <button onclick="window.toggleBookmark('${r.full_name || r.name}')" title="Bookmark" class="text-xs transition hover:scale-125">
                  ${isBookmarked ? '🔖' : '📑'}
                </button>
              </div>
            </div>

            <div class="mt-2.5 flex items-baseline justify-between gap-2">
              <a href="${r.url}" target="_blank" class="text-sm font-bold text-textMain hover:text-accentPrimary transition truncate">
                ${r.full_name || r.name}
              </a>
              <span class="text-[10px] font-mono text-textMuted">${r.health?.last_push_days ?? 0}d ago</span>
            </div>

            <p class="mt-1.5 text-xs text-textMuted leading-relaxed line-clamp-2">${r.description || '[No description provided]'}</p>

            <div class="mt-3 flex flex-wrap gap-1">
              ${(r.capabilities?.intent_tags || []).slice(0, 2).map(tag => `<span class="text-[9px] font-mono px-1.5 py-0.2 rounded bg-radarDark text-textMuted border border-borderDark">${tag}</span>`).join('')}
              <span class="text-[9px] font-mono px-1.5 py-0.2 rounded bg-radarDark text-textMuted border border-borderDark">${r.hardware_req}</span>
            </div>
          </div>

          <div class="mt-4 pt-3 border-t border-borderDark flex items-center justify-between text-xs font-mono">
            <span class="text-textMuted text-[11px]">${r.language}</span>
            <div class="flex items-center gap-2">
              ${(r.stars_24h > 0) ? `<span class="text-accentSecondary text-[11px] font-bold">+${r.stars_24h} 24h</span>` : ''}
              <span class="text-accentPrimary text-[11px] font-semibold">⭐ ${r.stars.toLocaleString()}</span>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const rawSearch = searchInput.value.toLowerCase().trim();

      // Clean search string by stripping out any typed key:value tokens handled by chips
      const cleanFreeText = rawSearch.replace(/(lang|discipline|needs|lic|stage):[^\s]+/gi, '').trim();

      let filtered = repositories.filter(r => {
        if (showBookmarksOnly && !bookmarks.includes(r.full_name || r.name)) return false;

        // Apply Active Chips Constraints
        for (const chip of activeChips) {
          const k = chip.key.toLowerCase();
          const v = chip.val.toLowerCase();

          if (k === 'lang' && (r.language || '').toLowerCase() !== v) return false;
          if (k === 'discipline' && (r.category || '').toLowerCase() !== v) return false;
          if (k === 'lic' && (r.license || '').toLowerCase() !== v) return false;
          if (k === 'stage' && (r.health?.stage || '').toLowerCase() !== v) return false;
          if (k === 'needs') {
            if (v === 'cpu-only' && r.is_cuda_ready && !r.capabilities?.hardware?.cpu_supported) return false;
            if (v === 'gpu' && !r.is_cuda_ready) return false;
            if (v === 'local-first' && !r.is_local_first) return false;
            if (v === 'mcp' && !(r.capabilities?.integrations || []).includes('mcp-server')) return false;
          }
        }

        // Apply Natural Language Inferred Constraints
        if (nlFilters.needs) {
          if (nlFilters.needs === 'cpu-only' && r.is_cuda_ready && !r.capabilities?.hardware?.cpu_supported) return false;
          if (nlFilters.needs === 'gpu' && !r.is_cuda_ready) return false;
        }
        if (nlFilters.lang && !(r.language || '').toLowerCase().includes(nlFilters.lang)) {
          return false;
        }

        // Free-text query evaluation
        if (cleanFreeText) {
          const hay = `${r.name} ${r.full_name} ${r.description} ${r.language} ${(r.topics || []).join(' ')}`.toLowerCase();
          if (!hay.includes(cleanFreeText)) return false;
        }

        return true;
      });

      document.getElementById('matchCounter').textContent = `${filtered.length} repos`;

      const container = document.getElementById('repoContainer');
      if (!filtered.length) {
        container.innerHTML = `<div class="py-20 text-center text-textMuted font-mono text-sm col-span-full">No repositories match this query. Try removing some filter chips.</div>`;
        return;
      }

      container.innerHTML = filtered.map((r, i) => renderCard(r, i)).join('');
    }

    loadDataset();
  </script>
</body>
</html>
